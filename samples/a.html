<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}a{color:inherit;text-decoration:none}body{font-family:"Zen Kaku Gothic New",sans-serif;overflow-x:hidden}
.demo{background:#16302a;color:#dfe7df;font-size:14px;text-align:center;padding:6px}
.shine{position:relative;overflow:hidden}.shine:before{content:"";position:absolute;top:-20%;left:-60%;width:40%;height:140%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-22deg);animation:sh 5.5s ease-in-out infinite}@keyframes sh{0%,62%{left:-60%}100%{left:140%}}
.up{opacity:0;transform:translateY(26px);animation:up 1.8s cubic-bezier(.22,.61,.36,1) forwards}@keyframes up{to{opacity:1;transform:none}}
.d1{animation-delay:.4s}.d2{animation-delay:.9s}.d3{animation-delay:1.4s}.d4{animation-delay:1.9s}.d5{animation-delay:2.4s}
</style><style>
.h{position:relative;height:calc(100vh - 32px);min-height:620px;overflow:hidden;color:#fff;background:#1d2a26}
.p{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.15);transition:opacity 3s ease,transform 12s linear}
.p.on{opacity:1;transform:scale(1.02)}
.h:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,26,22,.15),rgba(14,26,22,.62))}
header{position:absolute;z-index:3;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:26px 48px}
.logo{font-family:"Shippori Mincho";font-size:26px;letter-spacing:.2em}.logo small{display:block;font-family:"Cormorant Garamond";font-size:13px;letter-spacing:.4em;opacity:.8}
.tel{font-family:"Cormorant Garamond";font-size:28px;letter-spacing:.08em;text-align:right;line-height:1.2}.tel small{display:block;font-family:inherit;font-size:13px;opacity:.8}
.v{position:absolute;z-index:3;right:10vw;top:16vh;writing-mode:vertical-rl;font-family:"Shippori Mincho";font-weight:600;font-size:clamp(40px,4.6vw,66px);line-height:1.7;letter-spacing:.22em;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.vs{position:absolute;z-index:3;right:calc(10vw + 270px);top:17vh;writing-mode:vertical-rl;font-family:"Shippori Mincho";font-size:19px;letter-spacing:.4em;line-height:2.2}
.en{position:absolute;z-index:3;left:48px;bottom:130px;font-family:"Cormorant Garamond";font-style:italic;font-size:clamp(60px,8vw,120px);line-height:1;opacity:.92}
.box{position:absolute;z-index:3;left:48px;bottom:40px;display:flex;gap:18px;align-items:center}
.btn{display:inline-flex;align-items:center;height:64px;padding:0 34px;border-radius:999px;background:#b8955a;color:#fff;font-size:18px;font-weight:700;letter-spacing:.06em}
.gl{background:rgba(255,255,255,.16);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:14px 28px;font-size:17px}
</style></head><body><div class="demo">制作デモサイト｜院名・料金などはすべて架空のサンプルです</div><section class="h">
<div class="p on" style="background-image:url(../assets/treat.jpg)"></div><div class="p" style="background-image:url(../assets/head.jpg)"></div><div class="p" style="background-image:url(../assets/counsel.jpg)"></div>
<header class="up"><div class="logo">はる整体院<small>HARU SEITAI</small></div><div class="tel"><small>ご予約・ご相談</small>00-0000-0000</div></header>
<p class="v up d1">からだの声に、<br>耳をすませる。</p>
<p class="vs up d2">完全予約制　話を聞く整体院</p>
<p class="en up d3">Listen to your body.</p>
<div class="box up d4"><a class="btn shine" href="#">初回体験 ¥3,980 で予約する</a><span class="gl">〇〇駅 徒歩3分</span></div>
</section><script>var p=document.querySelectorAll('.p'),i=0;setInterval(function(){p[i].classList.remove('on');i=(i+1)%p.length;p[i].classList.add('on')},7500)</script></body></html>
