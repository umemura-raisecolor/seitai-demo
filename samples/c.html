<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>*{box-sizing:border-box;margin:0;padding:0}a{color:inherit;text-decoration:none}body{font-family:"Zen Kaku Gothic New",sans-serif;overflow-x:hidden}
.demo{background:#16302a;color:#dfe7df;font-size:14px;text-align:center;padding:6px}
.shine{position:relative;overflow:hidden}.shine:before{content:"";position:absolute;top:-20%;left:-60%;width:40%;height:140%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-22deg);animation:sh 5.5s ease-in-out infinite}@keyframes sh{0%,62%{left:-60%}100%{left:140%}}
.up{opacity:0;transform:translateY(26px);animation:up 1.8s cubic-bezier(.22,.61,.36,1) forwards}@keyframes up{to{opacity:1;transform:none}}
.d1{animation-delay:.4s}.d2{animation-delay:.9s}.d3{animation-delay:1.4s}.d4{animation-delay:1.9s}.d5{animation-delay:2.4s}
</style><style>
body{background:#f4f1ea;color:#16302a}
header{display:flex;align-items:center;justify-content:space-between;padding:24px 48px}
.logo{font-family:"Shippori Mincho";font-weight:700;font-size:25px;letter-spacing:.16em}
.nav{display:flex;gap:30px;font-size:16px;font-weight:500}
.h{position:relative;height:calc(100vh - 128px);min-height:560px;overflow:hidden}
.big{position:absolute;left:44px;top:4%;font-weight:900;font-size:clamp(80px,10vw,150px);line-height:1.05;letter-spacing:-.02em;z-index:1}
.big span{display:block;overflow:hidden}.big span i{display:inline-block;font-style:normal;transform:translateY(105%);animation:ri 1.8s cubic-bezier(.22,.61,.36,1) forwards}
.big span:nth-child(2) i{animation-delay:.4s;color:#b8955a}.big span:nth-child(3) i{animation-delay:.8s}
@keyframes ri{to{transform:none}}
.circle{position:absolute;right:6vw;top:50%;width:min(46vw,560px);aspect-ratio:1;border-radius:50%;overflow:hidden;transform:translateY(-50%);z-index:2;clip-path:circle(0% at 50% 50%);animation:cc 2.6s cubic-bezier(.22,.61,.36,1) .6s forwards}
@keyframes cc{to{clip-path:circle(50% at 50% 50%)}}
.circle img{width:100%;height:100%;object-fit:cover;animation:zm 14s linear infinite alternate}@keyframes zm{to{transform:scale(1.12)}}
.ring{position:absolute;right:calc(6vw - 40px);top:50%;width:calc(min(46vw,560px) + 80px);aspect-ratio:1;transform:translateY(-50%);z-index:1;animation:rot 50s linear infinite}
@keyframes rot{to{transform:translateY(-50%) rotate(360deg)}}
.ring text{font-family:"Cormorant Garamond";font-size:15px;letter-spacing:.35em;fill:#16302a}
.side{position:absolute;left:300px;bottom:60px;flex-direction:column;align-items:flex-start;gap:20px;z-index:3;display:flex;align-items:flex-end;gap:28px}
.side p{font-size:19px;line-height:1.9;max-width:22em}
.btn{display:inline-flex;align-items:center;height:68px;padding:0 36px;border-radius:999px;background:#16302a;color:#fff;font-size:18px;font-weight:700;white-space:nowrap}.btn em{font-style:normal;color:#d9bf8c;margin:0 6px}
.badge{position:absolute;z-index:4;right:calc(6vw + 10px);bottom:8%;width:150px;height:150px;border-radius:50%;background:#b8955a;color:#fff;display:grid;place-items:center;text-align:center;line-height:1.3;font-weight:700;font-size:16px;box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}.badge b{display:block;font-family:"Oswald";font-size:36px}
</style></head><body><div class="demo">制作デモサイト｜院名・料金などはすべて架空のサンプルです</div><header class="up"><div class="logo">はる整体院</div><nav class="nav"><a>考え方</a><a>メニュー</a><a>お客様の声</a><a>アクセス</a></nav></header>
